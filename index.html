<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIA by Apolo – Preselección de pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f5;--card:#fff;--ink:#3b3a40;--mut:#85808a;--pink:#d6336c;--soft:#f6e3e9;--line:#eadfe2;--ok:#2f7d5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b1f;--card:#27242a;--ink:#f1eaee;--mut:#a79fa8;--pink:#ee6a9a;--soft:#3a2b33;--line:#3a353c;--ok:#5fc59a}}
:root[data-theme="dark"]{--bg:#1d1b1f;--card:#27242a;--ink:#f1eaee;--mut:#a79fa8;--pink:#ee6a9a;--soft:#3a2b33;--line:#3a353c;--ok:#5fc59a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Jost,system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
.logo{font:600 44px/1 Caveat,cursive;color:var(--pink)}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1100px;margin:auto;padding:12px 20px 120px;display:grid;gap:24px;grid-template-columns:1fr}
@media(min-width:900px){main{grid-template-columns:1fr 340px;align-items:start}}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.p img{width:100%;display:block;aspect-ratio:10/7;object-fit:cover}
.pb{padding:12px 14px 14px}
.ref{color:var(--pink);font-size:13px;font-weight:500}
.nm{font-weight:600;font-size:18px;margin:0}
.pr{color:var(--pink);font-weight:600;font-size:20px;float:right}
.cols{display:flex;gap:8px;margin:10px 0}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed=true]{outline:2px solid var(--pink);outline-offset:2px}
.sw i{position:absolute;top:-6px;right:-6px;background:var(--pink);color:#fff;font:600 10px/16px Jost;width:16px;text-align:center;border-radius:8px;font-style:normal}
.cn{font-size:13px;color:var(--mut);margin:0 0 6px}
.sz{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sz label{font-size:12px;color:var(--mut);text-align:center}
.sz input{width:100%;margin-top:2px;padding:6px 0;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px Jost}
.sz input:focus,button:focus-visible,.sw:focus-visible,.f input:focus{outline:2px solid var(--pink);outline-offset:1px}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1}
button{font:500 14px Jost;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 10px}
button.pri{background:var(--pink);color:#fff;border-color:var(--pink)}
button:disabled{opacity:.45;cursor:not-allowed}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px}
aside h2{margin:0 0 8px;font-size:20px}
.tot{display:flex;justify-content:space-between;font-size:15px;padding:3px 0}
.big{font-size:24px;font-weight:600;color:var(--pink)}
.lines{max-height:240px;overflow:auto;margin:8px 0;border-top:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln small{color:var(--mut);display:block}
.empty{color:var(--mut);font-size:14px;padding:12px 0}
.min{font-size:13px;padding:8px 10px;border-radius:8px;background:var(--soft);margin:8px 0}
.min.ok{color:var(--ok)}
.f{display:grid;gap:8px;margin:12px 0}
.f input,.f textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 15px Jost}
.act{display:grid;gap:8px}
#msg{font-size:13px;color:var(--ok);min-height:18px}
@media(max-width:899px){aside{position:static}}
</style>
</head>
<body>
<header>
  <div class="logo">mia <span style="font:500 13px Jost;color:var(--mut)">by APOLO</span></div>
  <p>Preselección de pedido · Primavera–Verano 2026 · Tallas 35 a 40</p>
</header>
<main>
  <section class="grid" id="grid" aria-label="Catálogo"></section>
  <aside aria-live="polite">
    <h2>Tu preselección</h2>
    <div class="lines" id="lines"></div>
    <div class="tot"><span>Pares</span><b id="tp">0</b></div>
    <div class="tot"><span>Total estimado</span><span class="big" id="tm">$ 0,00</span></div>
    <div class="min" id="min"></div>
    <div class="f">
      <input id="cli" placeholder="Nombre del cliente / tienda" autocomplete="organization">
      <input id="tel" placeholder="Teléfono de contacto" inputmode="tel" autocomplete="tel">
      <textarea id="obs" rows="2" placeholder="Observaciones (opcional)"></textarea>
    </div>
    <div class="act">
      <button class="pri" id="wa" disabled>Enviar por WhatsApp</button>
      <button id="cp" disabled>Copiar resumen</button>
      <button id="csv" disabled>Descargar CSV</button>
      <button id="clr">Vaciar pedido</button>
    </div>
    <div id="msg"></div>
  </aside>
</main>

/* ===== ESTADO ===== */
let order={};      // clave "ref|color|talla" -> cantidad
let sel={};        // ref -> color seleccionado
const $=id=>document.getElementById(id);
const money=n=>"$ "+n.toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});
try{const s=JSON.parse(localStorage.getItem("mia_pedido")||"{}");order=s.order||{};$("cli").value=s.cli||"";$("tel").value=s.tel||"";$("obs").value=s.obs||""}catch(e){}
function save(){try{localStorage.setItem("mia_pedido",JSON.stringify({order,cli:$("cli").value,tel:$("tel").value,obs:$("obs").value}))}catch(e){}}
const qty=(r,c)=>CONFIG.sizes.reduce((a,t)=>a+(order[`${r}|${c}|${t}`]||0),0);

function render(){
  $("grid").innerHTML=PRODUCTS.map((x,i)=>{
    const cur=sel[x.ref]||(sel[x.ref]=x.c[0]);
    return `<article class="p"><img src="${IMGS[i]||""}" alt="${x.n}" loading="lazy">
    <div class="pb"><span class="pr">${money(x.p)}</span><div class="ref">REF. ${x.ref}</div><h3 class="nm">${x.n}</h3>
    <div class="cols">${x.c.map(c=>{const q=qty(x.ref,c);return `<button class="sw" data-r="${x.ref}" data-c="${c}" aria-pressed="${c===cur}" aria-label="${c}" title="${c}" style="background:${COLORS[c]}">${q?`<i>${q}</i>`:""}</button>`}).join("")}</div>
    <p class="cn">Color: <b>${cur}</b> · pares en este color: ${qty(x.ref,cur)}</p>
    <div class="sz">${CONFIG.sizes.map(t=>`<label>${t}<input type="number" min="0" inputmode="numeric" data-k="${x.ref}|${cur}|${t}" value="${order[`${x.ref}|${cur}|${t}`]||""}" placeholder="0"></label>`).join("")}</div>
    <div class="quick"><button data-curve="${x.ref}">+1 curva (35–40)</button><button data-zero="${x.ref}">Quitar color</button></div>
    </div></article>`}).join("");
  summary();
}
function lines(){
  const L=[];
  PRODUCTS.forEach(x=>x.c.forEach(c=>{
    const t=CONFIG.sizes.filter(s=>order[`${x.ref}|${c}|${s}`]).map(s=>`${s}×${order[`${x.ref}|${c}|${s}`]}`);
    const q=qty(x.ref,c);
    if(q)L.push({ref:x.ref,n:x.n,c,q,sub:q*x.p,det:t.join("  "),t})
  }));return L;
}
function summary(){
  const L=lines(),tp=L.reduce((a,l)=>a+l.q,0),tm=L.reduce((a,l)=>a+l.sub,0);
  $("lines").innerHTML=L.length?L.map(l=>`<div class="ln"><div><b>${l.n}</b> · ${l.c}<small>${l.ref} · ${l.det}</small></div><div>${l.q} par${l.q>1?"es":""}<small>${money(l.sub)}</small></div></div>`).join(""):'<div class="empty">Elige un color y escribe las cantidades por talla.</div>';
  $("tp").textContent=tp;$("tm").textContent=money(tm);
  const m=$("min");
  if(CONFIG.minPares>0){const ok=tp>=CONFIG.minPares;m.className="min"+(ok?" ok":"");m.textContent=ok?"Cumples el pedido mínimo.":`Pedido mínimo: ${CONFIG.minPares} pares. Te faltan ${CONFIG.minPares-tp}.`}
  else{m.className="min";m.textContent="Pedido mínimo: consultar condiciones comerciales."}
  ["wa","cp","csv"].forEach(id=>$(id).disabled=!L.length);
}
function text(){
  const L=lines(),tp=L.reduce((a,l)=>a+l.q,0),tm=L.reduce((a,l)=>a+l.sub,0);
  let s=`*Preselección de pedido – MIA by Apolo (P/V 2026)*\n`;
  if($("cli").value)s+=`Cliente: ${$("cli").value}\n`;
  if($("tel").value)s+=`Tel: ${$("tel").value}\n`;
  s+="\n"+L.map(l=>`• ${l.ref} ${l.n} – ${l.c}: ${l.det} = ${l.q} pares (${money(l.sub)})`).join("\n");
  s+=`\n\nTotal: ${tp} pares · ${money(tm)}`;
  if($("obs").value)s+=`\nObs: ${$("obs").value}`;
  return s;
}
function flash(t){$("msg").textContent=t;setTimeout(()=>$("msg").textContent="",2500)}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.classList.contains("sw")){sel[b.dataset.r]=b.dataset.c;render()}
  else if(b.dataset.curve){const r=b.dataset.curve,c=sel[r];CONFIG.sizes.forEach(t=>{const k=`${r}|${c}|${t}`;order[k]=(order[k]||0)+1});save();render()}
  else if(b.dataset.zero){const r=b.dataset.zero,c=sel[r];CONFIG.sizes.forEach(t=>delete order[`${r}|${c}|${t}`]);save();render()}
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  const v=Math.max(0,parseInt(e.target.value)||0);
  v?order[k]=v:delete order[k];save();render();
});
["cli","tel","obs"].forEach(id=>$(id).addEventListener("input",save));
$("clr").onclick=()=>{if(confirm("¿Vaciar todo el pedido?")){order={};save();render()}};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(text().replace(/\*/g,""));flash("Resumen copiado")}catch(e){flash("No se pudo copiar")}};
$("wa").onclick=()=>{const n=CONFIG.whatsapp.replace(/\D/g,"");window.open(`https://wa.me/${n}?text=${encodeURIComponent(text())}`,"_blank")};
$("csv").onclick=()=>{
  const rows=[["Referencia","Modelo","Color",...CONFIG.sizes,"Pares","Precio unit.","Subtotal"]];
  lines().forEach(l=>{const x=PRODUCTS.find(p=>p.ref===l.ref);rows.push([l.ref,l.n,l.c,...CONFIG.sizes.map(s=>order[`${l.ref}|${l.c}|${s}`]||0),l.q,x.p,l.sub])});
  const csv=rows.map(r=>r.join(";")).join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\ufeff"+encodeURIComponent(csv);a.download="preseleccion_pedido_MIA.csv";document.body.appendChild(a);a.click();a.remove();
};
render();
</script>
</body>
